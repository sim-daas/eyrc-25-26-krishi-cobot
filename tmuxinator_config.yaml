name: ur5_waypoint_task
root: ~/robows

# Source ROS2 workspace on startup
on_project_start: |
  cd ~/robows
  source install/setup.bash

windows:
  - warehouse:
      - ros2 launch eyantra_warehouse task2b.launch.py
  - arm:
      - ros2 launch ur_simulation_gz spawn_arm.launch.py
  - blank:
      - sleep 10000
