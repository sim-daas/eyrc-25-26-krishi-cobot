ekf_filter_node:
  ros__parameters:
    # GENERAL PARAMETERS
    frequency: 100.0                  # Update frequency in Hz
    two_d_mode: true                 # Crucial for flat-ground robots
    publish_tf: true                 # We want the EKF to publish the odom->base_footprint transform

    # FRAME PARAMETERS
    map_frame: map                   # The world-fixed frame, published by SLAM
    odom_frame: odom                 # The odometry frame, published by this EKF node
    base_link_frame: ebot_base_link  # The robot's base frame

    # SENSOR INPUT 1: Wheel Odometry
    odom0: /odom
    odom0_config: [false, false, false, # [X, Y, Z] position
                   false, false, false, # [Roll, Pitch, Yaw] orientation
                   true,  false, false, # [Vx, Vy, Vz] velocity - ONLY USE Vx
                   false, false, true,  # [Vroll, Vpitch, Vyaw] angular velocity - ONLY USE Vyaw
                   false, false, false] # [Ax, Ay, Az] acceleration
    odom0_differential: false

    # SENSOR INPUT 2: IMU (/imu)
    # We will only use orientation and angular velocity. NO linear acceleration.
    imu0: /imu
    imu0_config: [false, false, false, # [X, Y, Z] position
                  false, false, true,  # [Roll, Pitch, Yaw] orientation - ONLY USE Yaw
                  false, false, false, # [Vx, Vy, Vz] velocity
                  false, false, true,  # [Vroll, Vpitch, Vyaw] angular velocity - ONLY USE Vyaw
                  false, false, false] # [Ax, Ay, Az] acceleration - DO NOT USE
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true
